name: Python Tests

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]
  workflow_dispatch: # 允许手动触发工作流

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 uv 和 Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"

      - name: 按插件声明安装依赖并运行单元测试
        run: |
          sdk_requirement=$(uv run --no-project python -P - <<'PY'
          from pathlib import Path

          import json

          sdk = json.loads(Path("_manifest.json").read_text(encoding="utf-8"))["sdk"]
          print(f"maibot-plugin-sdk>={sdk['min_version']},<={sdk['max_version']}")
          PY
          )
          # 避免插件目录内的 types.py 遮蔽 Python 标准库。
          uv run --no-project --with "$sdk_requirement" --with aiohttp \
            python -P -m unittest discover -s tests -p 'test_*.py' -v
